<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --accent:{{accent}};
  --bg:#FAF8F8;
  --panel:#FFFFFF;
  --panel-2:#F3EFEF;
  --fg:#1A1618;
  --muted:#615A5C;
  --faint:#8C8486;
  --line:#E5DFE0;
  --line-strong:#CFC6C8;
  --ok:#146B43;
  --ok-bg:#EAF5EF;
  --ok-line:#B6DCC6;
  --progress:#2FA866;
  --warn:#8A5A00;
  --warn-bg:#FBF2E2;
  --warn-line:#E8D2A8;
  --code-bg:#F3EFEF;
  --sidebar:#F3EFEF;
  --term-bg:#1A1618;--term-fg:#F2EFEF;--term-muted:#A8A2A3;--term-line:#332D2F;
  --active-bg:#FDECEC;
  --badge:#EAE4E5;
  --shadow:0 1px 2px rgba(26,22,24,.05),0 8px 24px -16px rgba(26,22,24,.25);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --accent:{{accent_dark}};--bg:#0D0D0D;--panel:#161616;--panel-2:#1E1E1E;
    --fg:#F2EFEF;--muted:#A8A2A3;--faint:#7A7475;--line:#262626;--line-strong:#3A3A3A;
    --ok:#3FBF7F;--ok-bg:#0F2419;--ok-line:#1F4D34;--progress:#3FBF7F;
    --warn:#E0A63C;--warn-bg:#2A2110;--warn-line:#4A3A18;
    --code-bg:#1E1E1E;--sidebar:#111111;--active-bg:#2A1416;--badge:#2A2626;--term-bg:#141212;--term-line:#2E2A2A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --accent:{{accent_dark}};--bg:#0D0D0D;--panel:#161616;--panel-2:#1E1E1E;
  --fg:#F2EFEF;--muted:#A8A2A3;--faint:#7A7475;--line:#262626;--line-strong:#3A3A3A;
  --ok:#3FBF7F;--ok-bg:#0F2419;--ok-line:#1F4D34;--progress:#3FBF7F;
  --warn:#E0A63C;--warn-bg:#2A2110;--warn-line:#4A3A18;
  --code-bg:#1E1E1E;--sidebar:#111111;--active-bg:#2A1416;--badge:#2A2626;--term-bg:#141212;--term-line:#2E2A2A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}.confetti{display:none}}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  font-size:18px;line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2,h3{text-wrap:balance;letter-spacing:-.021em;margin:0;line-height:1.25}
p{margin:0;max-width:68ch}
a{color:var(--accent)}
img{max-width:100%}
code{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.87em;overflow-wrap:anywhere;
  background:var(--panel-2);border:1px solid var(--line);padding:1px 6px;border-radius:2px}
.flow>*+*{margin-top:24px}
main>.wrap.flow{padding-bottom:64px}
[hidden]{display:none!important}

.shell{display:grid;grid-template-columns:272px minmax(0,1fr);align-items:start}
main{min-width:0;padding-bottom:56px}
.wrap{max-width:892px;margin:0 auto;padding-inline:56px}

aside{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--sidebar);
  border-right:1px solid var(--line);padding:34px 24px 40px;display:flex;flex-direction:column;gap:26px}
.brand{display:flex;flex-direction:column;gap:5px}
.brand .eb{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.brand .nm{font-size:17px;font-weight:700;line-height:1.25;letter-spacing:-.02em}
.lbl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.prog{display:flex;flex-direction:column;gap:9px}
.prog .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prog .ph .cnt{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.prog .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.prog .fill{height:100%;width:0;background:var(--progress);border-radius:4px;transition:width .4s ease}
.prog .cnt{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}
.themebar{position:fixed;top:14px;right:16px;z-index:20;display:flex;border:1px solid var(--line-strong);border-radius:999px;
  overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.themebar button{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.04em;padding:7px 12px;min-height:32px;
  border:0;background:transparent;color:var(--muted);cursor:pointer}
.themebar button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.pick{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 18px;background:var(--panel);
  border:1px solid var(--line);border-radius:2px}
.pick .lbl{color:var(--muted)}
.pick .row{display:flex;flex-wrap:wrap;gap:8px}
.pick button{font:500 14px 'IBM Plex Sans',sans-serif;padding:8px 14px;min-height:38px;border:1px solid var(--line-strong);border-radius:999px;
  background:var(--bg);color:var(--fg);cursor:pointer}
.pick button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pick .note{flex-basis:100%;font-size:13.5px;color:var(--faint)}

nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
nav ul{gap:3px}
nav a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--muted);
  font-size:14.5px;line-height:1.35;padding:8px 9px;border-radius:8px;
  transition:background .35s ease,color .35s ease}
nav a:hover{background:var(--panel);color:var(--fg)}
nav a .n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-content:center;
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;background:var(--badge);color:var(--faint);
  transition:background .35s ease,color .35s ease,transform .35s cubic-bezier(.3,1.6,.5,1)}
nav a.active{color:var(--fg);font-weight:600;background:var(--active-bg)}
nav a.active .n{background:var(--accent);color:#FFFFFF}
nav a.done{color:var(--ok)}
nav a.done .n{background:var(--ok);color:#FFFFFF}
nav a.done.active{color:var(--fg)}

.hero{padding-block:80px 50px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;
  letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
h1{font-size:clamp(34px,5.4vw,54px);font-weight:700;line-height:1.06}
.lede{font-size:20px;color:var(--muted);margin-top:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.chip{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;
  border:1px solid var(--line-strong);border-radius:2px;padding:6px 11px;color:var(--muted)}
.chip.on{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok)}

.notice{background:var(--warn-bg);border:1px solid var(--warn-line);border-left:3px solid var(--warn);
  padding:24px 26px;border-radius:2px}
.notice p{font-size:16px}
.notice .ttl{font-weight:600;display:block;margin-bottom:5px}
.legend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:18px}
.legend div{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:12px 13px;min-width:0}
.legend b{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
.legend span{font-size:13.5px;color:var(--muted);line-height:1.5;display:block}

.rescue{border:1px solid var(--line);border-radius:2px;background:var(--panel);padding:20px 22px}
.rescue>*+*{margin-top:12px}
.rescue .ttl{font-weight:600}

section.part{padding:72px 0;border-top:1px solid var(--line);scroll-margin-top:16px}
.part-hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;margin-bottom:14px}
.pnum{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;
  letter-spacing:.15em;text-transform:uppercase;color:var(--accent)}
.ptime{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--faint);margin-left:auto}
h2{font-size:clamp(26px,3.6vw,35px);font-weight:700;margin-bottom:16px}
p.intro{font-size:19px;color:var(--muted)}

.where{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--muted)}
.where b{font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:10.5px;color:var(--faint)}
.where span{background:var(--panel);border:1px solid var(--line-strong);border-radius:2px;padding:5px 11px;color:var(--fg)}

ol.steps{list-style:none;margin:36px 0 0;padding:0 0 0 46px;position:relative;counter-reset:s}
ol.steps::before{content:"";position:absolute;left:13px;top:8px;bottom:8px;width:1px;background:var(--line-strong)}
ol.steps>li{position:relative;padding-bottom:44px;min-width:0}
ol.steps>li:last-child{padding-bottom:0}
ol.steps>li::before{content:counter(s);counter-increment:s;position:absolute;left:-46px;top:-1px;
  width:27px;height:27px;border-radius:50%;background:var(--bg);border:1px solid var(--line-strong);
  color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center}
.stitle{font-weight:600;font-size:19px;display:block;margin-bottom:12px;line-height:1.35}
ol.steps p{font-size:17px;color:var(--muted)}
ol.steps strong{color:var(--fg);font-weight:600}
ol.steps>li>*+*{margin-top:14px}

.cmd{position:relative;background:var(--term-bg);border:1px solid var(--term-line);border-radius:8px;overflow:hidden}
.cmd .k{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--term-muted);padding:0 92px 0 14px;min-height:44px;display:flex;align-items:center;border-bottom:1px solid var(--term-line)}
.cmd pre{margin:0;padding:14px 16px 16px;font-family:'IBM Plex Mono',monospace;font-size:14.5px;line-height:1.7;color:var(--term-fg);
  white-space:pre-wrap;overflow-wrap:anywhere}
.copy{position:absolute;top:7px;right:8px;font:600 12px 'IBM Plex Sans',sans-serif;cursor:pointer;background:var(--accent);
  color:#FFFFFF;border:0;padding:7px 13px;border-radius:5px;min-height:30px;transition:background .2s}
.copy:hover{filter:brightness(1.08)}
.copy.done{background:var(--ok)}

.out{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--faint);
  border-radius:2px;padding:18px 22px;overflow-x:auto}
.out .lbl{margin-bottom:10px}
.out pre{margin:0;font-family:'IBM Plex Mono',monospace;font-size:13.5px;line-height:1.75;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.out pre b{color:var(--fg);font-weight:500}

.see{background:var(--ok-bg);border:1px solid var(--ok-line);border-radius:2px;padding:18px 22px}
.see .ck{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ok);display:flex;align-items:center;gap:8px;margin-bottom:6px}
.see p,.see li{font-size:16.5px;color:var(--fg)}
.see ul{margin:0;padding-left:20px}
.see li+li{margin-top:4px}

.quiz{border:1px solid var(--line);border-radius:2px;background:var(--panel);padding:20px 22px}
.quiz>*+*{margin-top:12px}
.quiz .k{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.quiz .q{font-weight:600;font-size:17px;color:var(--fg)}
.quiz .opts{display:grid;gap:8px}
.quiz .opt{text-align:left;font:inherit;font-size:16px;line-height:1.45;color:var(--fg);background:var(--bg);
  border:1px solid var(--line-strong);border-radius:2px;padding:11px 14px;min-height:44px;cursor:pointer;
  display:flex;gap:10px;align-items:flex-start}
.quiz .opt .box{flex:none;width:16px;height:16px;margin-top:3px;border:1.5px solid var(--line-strong);border-radius:50%}
.quiz[data-multi] .opt .box{border-radius:2px}
.quiz .opt[aria-pressed="true"] .box{background:var(--fg);border-color:var(--fg)}
.quiz .opt.right{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok)}
.quiz .opt.wrong{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn)}
.quiz .check{font:600 13px 'IBM Plex Sans',sans-serif;background:var(--fg);color:var(--bg);border:0;border-radius:2px;padding:10px 16px;min-height:40px;cursor:pointer}
.quiz .fb{font-size:15.5px;padding:10px 14px;border-radius:2px}
.quiz .fb.right{background:var(--ok-bg);color:var(--ok)}
.quiz .fb.wrong{background:var(--warn-bg);color:var(--warn)}

details.fix{border:1px solid var(--line);border-radius:2px;background:var(--panel)}
details.fix summary{cursor:pointer;padding:14px 18px;font-size:15.5px;font-weight:500;color:var(--muted);
  list-style:none;display:flex;align-items:center;gap:9px;background:var(--panel-2);min-height:44px}
details.fix summary::-webkit-details-marker{display:none}
details.fix summary::before{content:"▸";color:var(--accent);font-size:12px}
details.fix[open] summary::before{content:"▾"}
details.fix .body{padding:16px 18px 20px;font-size:16px;color:var(--muted)}
details.fix .body>*+*{margin-top:12px}
details.fix .body strong{color:var(--fg)}

figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:10px;box-shadow:var(--shadow)}
figure img{display:block;width:100%;height:auto;border-radius:1px}
figure figcaption{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--faint);padding:10px 4px 2px;line-height:1.5}
figure figcaption b{color:var(--accent);font-weight:600}
figure.pending{display:grid;place-content:center;min-height:180px;border-style:dashed;box-shadow:none;text-align:center;
  font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--faint)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

.tip{border-left:3px solid var(--line-strong);padding:5px 0 5px 20px;font-size:16.5px;color:var(--muted)}
.tip strong{color:var(--fg)}
.lv{display:none}

.next{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  margin-top:48px;padding-top:20px;border-top:1px solid var(--line)}
.next .hint{font-size:15px;color:var(--muted)}
.next button{font:600 15px 'IBM Plex Sans',sans-serif;border:0;border-radius:2px;padding:14px 22px;min-height:48px;cursor:pointer;
  background:var(--accent);color:#FFFFFF;transition:background .2s,color .2s}
.next.done .go{background:var(--ok-bg);color:var(--ok)}
.next .back{background:transparent;color:var(--muted);border:1px solid var(--line-strong);font-weight:500;order:-1}
.next .hint{flex:1}
.next .hint.win{font-size:18px;font-weight:700;color:var(--ok)}
.prog .reset{align-self:flex-start;background:none;border:0;padding:0;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--faint);text-decoration:underline;cursor:pointer}
.paged section.part{border-top:0;transition:opacity .35s ease,transform .35s cubic-bezier(.2,.8,.2,1)}
.paged section.part.enter{opacity:0;transform:translateY(16px)}
nav a.flash .n{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
nav a.flash{animation:glow .9s ease}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(225,18,27,.35)}100%{box-shadow:0 0 0 8px rgba(225,18,27,0)}}

.exit{background:var(--ok-bg);border-top:2px solid var(--ok);border-bottom:1px solid var(--ok-line)}
.exit .wrap{padding-block:52px;display:flex;gap:22px;align-items:flex-start}
.exit .flag{font-size:28px;line-height:1.2}
.exit h3{font-size:23px;font-weight:700;color:var(--ok);margin-bottom:12px}
.exit p{font-size:17px;color:var(--fg)}
.cols{display:grid;gap:18px}
.cols.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.card .k{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.card h3{font-size:18px;font-weight:600}
.card p{font-size:15.5px;color:var(--muted)}
.doclinks{display:flex;flex-direction:column;gap:8px;margin-top:36px;padding-top:20px;border-top:1px solid var(--line)}
.doclink{font-family:'IBM Plex Mono',monospace;font-size:13px;text-decoration:none;color:var(--muted)}
.doclink::before{content:"↗";color:var(--accent);margin-right:8px}
footer.made{border-top:1px solid var(--line);padding-block:28px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--faint)}
footer.made a{color:var(--muted)}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-20px;display:block;border-radius:2px;animation:fall var(--d) var(--w) cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:1}80%{opacity:1}100%{transform:translate(var(--x),105vh) rotate(var(--r));opacity:0}}

.mobar{display:none}
.sheet,.sheet-bg{display:none}
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(20,17,18,.45);opacity:0;transition:opacity .3s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:86vh;overflow-y:auto;background:var(--panel);color:var(--fg);
  border-radius:18px 18px 0 0;box-shadow:0 -24px 48px -24px rgba(0,0,0,.6);flex-direction:column;gap:16px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sheet-bg.open{opacity:1}
.sheet .grab{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--line-strong)}
.sheet .shd{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:16px}
.sheet .x{background:none;border:0;font-size:18px;color:var(--muted);min-width:44px;min-height:44px;cursor:pointer}
.sheet nav a{font-size:15.5px;padding:10px}
.sheet .stheme{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet .themebar.in{position:static;box-shadow:none}
.legend-toggle{display:none;margin-top:10px;background:none;border:0;padding:6px 0;font:600 14px 'IBM Plex Sans',sans-serif;color:var(--warn);cursor:pointer}
figure img{cursor:zoom-in}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(10,9,9,.92);display:grid;place-items:center;padding:16px;cursor:zoom-out;
  opacity:0;transition:opacity .25s ease}
.lightbox.open{opacity:1}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
@media (max-width:1040px){.wrap{max-width:820px;padding-inline:40px}}
@media (max-width:940px){
  body{font-size:17px}
  .shell{grid-template-columns:minmax(0,1fr)}
  aside{display:none}
  .mobar{display:grid;gap:8px;width:100%;position:sticky;top:0;z-index:30;text-align:left;font:inherit;color:var(--fg);cursor:pointer;
    background:var(--panel);border:0;border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .mobar .mrow{display:flex;align-items:center;gap:12px;min-width:0}
  .mobar .ico{flex:none;width:44px;height:44px;display:grid;place-content:center;font-size:22px;line-height:1;color:var(--fg);
    border:1px solid var(--line-strong);border-radius:10px;background:var(--bg)}
  .mobar:active .ico{background:var(--panel-2)}
  .mobar .mtitle{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mobar .mcnt{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;color:var(--muted)}
  .mobar .bar{display:block;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  .mobar .fill{display:block;height:100%;width:0;background:var(--progress);border-radius:3px;transition:width .4s ease}
  .themebar{display:none}
  .sheet,.sheet-bg{display:flex}
  .sheet[hidden],.sheet-bg[hidden]{display:none!important}
  .sheet .themebar.in{display:flex}
  .notice .legend-toggle{display:inline-flex}
  .notice:not(.open) .legend{display:none}
  .paged main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .paged .next{position:fixed;left:0;right:0;bottom:0;z-index:25;margin:0;flex-wrap:wrap;gap:10px;background:var(--panel);
    border-top:1px solid var(--line);box-shadow:0 -10px 28px -20px rgba(0,0,0,.45);
    padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .paged .next .hint{display:none}
  .paged .next .hint.win{display:block;flex-basis:100%;order:-2;font-size:16px}
  .paged .next .back{width:48px;flex:none;padding:0}
  .paged .next .back .t{display:none}
  .paged .next .go{flex:1;width:auto}
  .wrap{padding-inline:max(16px,env(safe-area-inset-left,0px))}
  .exit .wrap{padding-block:38px;flex-direction:column;gap:14px}
  .hero{padding-block:44px 36px}
  section.part{padding:52px 0}
  .legend{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pair,.cols.three,.cols.two{grid-template-columns:minmax(0,1fr)}
  ol.steps{padding-left:36px}
  ol.steps::before{left:12px}
  ol.steps>li::before{left:-36px;width:25px;height:25px}
  .next .go{width:100%}
}
@media print{aside,.mobar,.copy,.next{display:none}.shell{display:block}section.part{page-break-inside:avoid}}
</style>
</head>
<body data-mode="{{mode}}">

<button class="mobar" id="mobar" type="button" aria-haspopup="dialog" aria-controls="sheet">
  <span class="mrow"><span class="ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span><span class="mtitle">{{brand}}</span><span class="mcnt" id="pcnt2"></span></span>
  <span class="bar"><span class="fill" id="pfill2"></span></span>
</button>
<div class="sheet-bg" id="sheetbg" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="{{L.steps}}" hidden>
  <span class="grab" aria-hidden="true"></span>
  <div class="shd"><b>{{brand}}</b><button type="button" class="x" id="sheetx" aria-label="{{L.close}}">✕</button></div>
  <div class="prog"><div class="ph"><span class="lbl">{{L.progress}}</span><span class="cnt" id="pcnt3"></span></div><div class="bar"><div class="fill" id="pfill3"></div></div><button type="button" class="reset" data-reset>{{L.reset}}</button></div>
  <nav id="snav"></nav>
  <div class="stheme"><span class="lbl">{{L.theme}}</span><div class="themebar in" role="group" aria-label="{{L.theme}}">
    <button type="button" data-theme-set="auto" aria-pressed="true">{{L.system}}</button>
    <button type="button" data-theme-set="light" aria-pressed="false">{{L.light}}</button>
    <button type="button" data-theme-set="dark" aria-pressed="false">{{L.dark}}</button>
  </div></div>
</div>

<div class="shell">
<aside>
  <div class="brand">
    <div class="eb">{{eyebrow}}</div>
    <div class="nm">{{brand}}</div>
  </div>
  <div class="prog">
    <div class="ph"><span class="lbl">{{L.progress}}</span><span class="cnt" id="pcnt"></span></div>
    <div class="bar"><div class="fill" id="pfill"></div></div>
    <button type="button" class="reset" id="preset" data-reset>{{L.reset}}</button>
  </div>
  <nav id="toc">
    <ul>
{{toc}}
    </ul>
  </nav>
</aside>

<main>
<div class="themebar" role="group" aria-label="{{L.theme}}">
  <button type="button" data-theme-set="auto" aria-pressed="true">{{L.system}}</button>
  <button type="button" data-theme-set="light" aria-pressed="false">{{L.light}}</button>
  <button type="button" data-theme-set="dark" aria-pressed="false">{{L.dark}}</button>
</div>
{{content}}
<footer class="made"><div class="wrap">{{L.made}} <a href="https://makerlabperu.github.io/guide-builder-skill/" target="_blank" rel="noopener">guide-builder ↗</a></div></footer>
</main>
</div>

<script>
(function(){
  var L={{L_json}};
  var KEY='{{storage_key}}';
  var state={theme:'auto',done:{},level:null,page:null};
  try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&typeof p==='object'){if(p.theme)state.theme=p.theme;if(p.done&&typeof p.done==='object')state.done=p.done;if(p.level)state.level=p.level;if(p.page)state.page=p.page;}}}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

  function setTheme(v){
    state.theme=v;
    if(v==='auto')document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme',v);
    document.querySelectorAll('[data-theme-set]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.themeSet===v));});
    save();
  }
  document.querySelectorAll('[data-theme-set]').forEach(function(b){b.addEventListener('click',function(){setTheme(b.dataset.themeSet);});});
  setTheme(state.theme);

  var levelBtns=document.querySelectorAll('[data-level-set]');
  function setLevel(v){
    state.level=v;
    document.querySelectorAll('.lv').forEach(function(el){el.style.display=el.dataset.lv===v?'block':'none';});
    levelBtns.forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.levelSet===v));});
    save();
  }
  if(levelBtns.length){
    levelBtns.forEach(function(b){b.addEventListener('click',function(){setLevel(b.dataset.levelSet);});});
    setLevel(state.level||levelBtns[0].dataset.levelSet);
  }

  function copyText(txt,b,idle){
    function ok(){b.textContent=L.copied;b.classList.add('done');setTimeout(function(){b.textContent=idle;b.classList.remove('done');},1600);}
    function fb(){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok();}catch(e){}document.body.removeChild(ta);}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok).catch(fb);}else fb();
  }
  document.querySelectorAll('.notice').forEach(function(n){
    var lg=n.querySelector('.legend');if(!lg)return;
    var t=document.createElement('button');t.type='button';t.className='legend-toggle';t.textContent=L.howto+' ▾';
    t.addEventListener('click',function(){var o=n.classList.toggle('open');t.textContent=L.howto+(o?' ▴':' ▾');});
    lg.parentNode.insertBefore(t,lg);
  });
  document.querySelectorAll('.cmd').forEach(function(box){
    var pre=box.querySelector('pre');if(!pre)return;
    var b=document.createElement('button');b.className='copy';b.type='button';b.textContent=L.copy;
    b.addEventListener('click',function(){copyText(pre.textContent.trim(),b,L.copy);});
    box.appendChild(b);
  });

  document.querySelectorAll('.quiz').forEach(function(qz){
    var answer=(qz.dataset.answer||'').split(',').map(function(s){return s.trim();}).filter(Boolean);
    var multi=qz.hasAttribute('data-multi');
    var opts=Array.prototype.slice.call(qz.querySelectorAll('.opt'));
    var fb=document.createElement('p');fb.className='fb';fb.hidden=true;fb.setAttribute('aria-live','polite');qz.appendChild(fb);
    var why=qz.querySelector('.why');if(why)why.hidden=true;
    opts.forEach(function(o){var bx=document.createElement('span');bx.className='box';o.insertBefore(bx,o.firstChild);o.setAttribute('aria-pressed','false');});
    function reveal(picked){
      var right=picked.length===answer.length&&picked.every(function(x){return answer.indexOf(x)>=0;});
      opts.forEach(function(o){
        o.classList.remove('right','wrong');
        if(answer.indexOf(o.dataset.opt)>=0&&right)o.classList.add('right');
        else if(picked.indexOf(o.dataset.opt)>=0&&!right)o.classList.add('wrong');
      });
      fb.hidden=false;fb.className='fb '+(right?'right':'wrong');
      fb.textContent=right?L.quiz_right:L.quiz_wrong;
      if(why)why.hidden=!right;
    }
    if(multi){
      var chk=document.createElement('button');chk.type='button';chk.className='check';chk.textContent=L.quiz_check;
      qz.insertBefore(chk,fb);
      opts.forEach(function(o){o.addEventListener('click',function(){o.setAttribute('aria-pressed',String(o.getAttribute('aria-pressed')!=='true'));});});
      chk.addEventListener('click',function(){reveal(opts.filter(function(o){return o.getAttribute('aria-pressed')==='true';}).map(function(o){return o.dataset.opt;}));});
    }else{
      opts.forEach(function(o){o.addEventListener('click',function(){opts.forEach(function(x){x.setAttribute('aria-pressed',String(x===o));});reveal([o.dataset.opt]);});});
    }
  });

  var pages=Array.prototype.slice.call(document.querySelectorAll('section.part'));
  var parts=pages.filter(function(s){return /^\d+$/.test(s.dataset.num||'');});
  var main=document.querySelector('main');
  var intro=pages.length?Array.prototype.slice.call(main.children).filter(function(el){
    return !el.classList.contains('themebar')&&!el.classList.contains('made')&&(el.compareDocumentPosition(pages[0])&Node.DOCUMENT_POSITION_FOLLOWING);
  }):[];
  var paged=document.body.dataset.mode!=='scroll'&&pages.length>1;
  var fill=document.getElementById('pfill'),fill2=document.getElementById('pfill2'),fill3=document.getElementById('pfill3'),cnt=document.getElementById('pcnt'),cnt2=document.getElementById('pcnt2'),cnt3=document.getElementById('pcnt3');
  var navLinks=Array.prototype.slice.call(document.querySelectorAll('nav a'));
  var current=-1;

  function refresh(){
    var n=parts.filter(function(s){return state.done[s.id];}).length;
    var pct=parts.length?Math.round(n/parts.length*100):0;
    [fill,fill2,fill3].forEach(function(f){if(f)f.style.width=pct+'%';});
    var label=L.count.replace('{n}',n).replace('{total}',parts.length);
    [cnt,cnt2,cnt3].forEach(function(c){if(c)c.textContent=label;});
    navLinks.forEach(function(a){
      var d=!!state.done[(a.getAttribute('href')||'').slice(1)];
      a.classList.toggle('done',d);
      var b=a.querySelector('.n');if(!b)return;
      if(!b.dataset.n)b.dataset.n=b.textContent;
      b.textContent=d?'✓':b.dataset.n;
    });
    return n;
  }
  function markActive(id,flash){
    navLinks.forEach(function(a){
      var on=a.getAttribute('href')==='#'+id;
      a.classList.toggle('active',on);
      if(on&&flash){a.classList.remove('flash');void a.offsetWidth;a.classList.add('flash');}
    });
  }
  function show(i,opts){
    opts=opts||{};
    if(i<0||i>=pages.length)return;
    if(!paged){pages[i].scrollIntoView({behavior:'smooth',block:'start'});return;}
    var changed=i!==current;current=i;
    pages.forEach(function(sec,k){sec.hidden=k!==i;});
    intro.forEach(function(el){el.hidden=i!==0;});
    if(changed){
      var sec=pages[i];sec.classList.add('enter');
      requestAnimationFrame(function(){requestAnimationFrame(function(){sec.classList.remove('enter');});});
    }
    state.page=pages[i].id;save();
    if(!opts.quiet&&!opts.anchor)history.replaceState(null,'','#'+pages[i].id);
    markActive(pages[i].id,changed&&!opts.quiet);
    var target=opts.anchor?document.getElementById(opts.anchor):null;
    if(target&&target!==pages[i])target.scrollIntoView({behavior:'smooth',block:'start'});
    else if(!opts.quiet)window.scrollTo({top:0,behavior:'auto'});
  }
  function pageOf(el){for(var k=0;k<pages.length;k++){if(pages[k]===el||pages[k].contains(el))return k;}return -1;}

  function confetti(){
    var layer=document.createElement('div');layer.className='confetti';layer.setAttribute('aria-hidden','true');
    var colors=['#2FA866','#E1121B','#F5B83D','#3C8DDE','#FF7A80','#1A1618'];
    for(var i=0;i<60;i++){
      var c=document.createElement('i'),w=6+(i%3)*3;
      c.style.cssText='left:'+((i*37)%100)+'%;width:'+w+'px;height:'+(w*1.6)+'px;background:'+colors[i%colors.length]+
        ';--d:'+(2.4+((i*29)%10)/10)+'s;--w:'+(((i*53)%90)/100)+'s;--x:'+(((i*41)%160)-80)+'px;--r:'+(360+(i%4)*180)+'deg';
      layer.appendChild(c);
    }
    document.body.appendChild(layer);setTimeout(function(){layer.remove();},4500);
  }

  var painters=[];
  pages.forEach(function(sec,i){
    var isStep=parts.indexOf(sec)>=0;
    var lastStep=isStep&&sec===parts[parts.length-1];
    var bar=document.createElement('div');bar.className='next';
    var left=document.createElement('span');left.className='hint';
    var btn=document.createElement('button');btn.type='button';btn.className='go';
    if(paged&&i>0){
      var back=document.createElement('button');back.type='button';back.className='back';back.setAttribute('aria-label',L.back.replace(/^←\s*/,''));
      back.innerHTML='<span aria-hidden="true">←</span> <span class="t"></span>';back.querySelector('.t').textContent=L.back.replace(/^←\s*/,'');
      back.addEventListener('click',function(){show(i-1);});
      bar.appendChild(back);
    }
    bar.appendChild(left);
    if(isStep||(paged&&i<pages.length-1))bar.appendChild(btn);
    var host=sec.querySelector(':scope > .wrap');
    if(!host){host=document.createElement('div');host.className='wrap';sec.appendChild(host);}
    host.appendChild(bar);
    function paint(){
      if(!isStep){btn.textContent=L.continue;return;}
      var d=!!state.done[sec.id];
      var all=refresh()===parts.length;
      bar.classList.toggle('done',d);
      left.classList.toggle('win',lastStep&&all);
      left.textContent=lastStep&&all?L.complete:(d?'':L.next_hint);
      btn.textContent=d?(paged&&i<pages.length-1?L.continue:L.done):(lastStep?L.finish:L.next);
    }
    btn.addEventListener('click',function(){
      if(!isStep){show(i+1);return;}
      if(state.done[sec.id]){
        if(paged&&i<pages.length-1){show(i+1);return;}
        delete state.done[sec.id];save();paint();refresh();return;
      }
      state.done[sec.id]=1;save();
      var n=refresh();
      if(n===parts.length){paintAll();confetti();return;}
      paint();
      if(paged)show(i+1);
      else if(!lastStep){var nx=pages[i+1];if(nx)nx.scrollIntoView({behavior:'smooth',block:'start'});}
    });
    painters.push(paint);
    paint();
  });
  function paintAll(){painters.forEach(function(f){f();});}
  refresh();
  document.querySelectorAll('[data-reset]').forEach(function(r){r.addEventListener('click',function(){state.done={};state.page=null;save();paintAll();refresh();closeSheet();if(paged)show(0);else window.scrollTo(0,0);});});

  var snav=document.getElementById('snav'),toc=document.getElementById('toc');
  if(snav&&toc){snav.innerHTML=toc.innerHTML;navLinks=Array.prototype.slice.call(document.querySelectorAll('nav a'));refresh();}
  var sheet=document.getElementById('sheet'),sheetbg=document.getElementById('sheetbg'),mobar=document.getElementById('mobar');
  function openSheet(){if(!sheet)return;sheet.hidden=false;sheetbg.hidden=false;requestAnimationFrame(function(){sheet.classList.add('open');sheetbg.classList.add('open');});mobar.setAttribute('aria-expanded','true');var x=document.getElementById('sheetx');if(x)x.focus();}
  function closeSheet(){if(!sheet||sheet.hidden)return;sheet.classList.remove('open');sheetbg.classList.remove('open');mobar.setAttribute('aria-expanded','false');setTimeout(function(){sheet.hidden=true;sheetbg.hidden=true;},300);}
  if(mobar)mobar.addEventListener('click',openSheet);
  if(sheetbg)sheetbg.addEventListener('click',closeSheet);
  var sx=document.getElementById('sheetx');if(sx)sx.addEventListener('click',closeSheet);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeSheet();var lb=document.querySelector('.lightbox');if(lb)lb.click();}});
  document.querySelectorAll('figure img').forEach(function(img){
    img.addEventListener('click',function(){
      var lb=document.createElement('div');lb.className='lightbox';lb.setAttribute('role','dialog');lb.setAttribute('aria-label',img.alt||'');
      var big=document.createElement('img');big.src=img.src;big.alt=img.alt;lb.appendChild(big);
      lb.addEventListener('click',function(){lb.classList.remove('open');setTimeout(function(){lb.remove();},250);});
      document.body.appendChild(lb);requestAnimationFrame(function(){lb.classList.add('open');});
    });
  });

  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;
    var id=a.getAttribute('href').slice(1);var el=id&&document.getElementById(id);if(!el)return;
    var k=pageOf(el);if(k<0)return;
    if(!paged)return;
    e.preventDefault();
    if(a.closest('.sheet'))closeSheet();
    show(k,{anchor:id});
    history.replaceState(null,'','#'+id);
  });

  if(paged){
    document.body.classList.add('paged');
    var startId=(location.hash||'').slice(1)||state.page;
    var startEl=startId&&document.getElementById(startId);
    var k=startEl?pageOf(startEl):-1;
    show(k>=0?k:0,{quiet:true,anchor:startEl&&k>=0?startId:null});
  }else{
    var links=Array.prototype.slice.call(document.querySelectorAll('aside nav a'));
    var targets=links.map(function(a){return document.querySelector(a.getAttribute('href'));});
    var spy=function(){
      var y=window.scrollY+120,cur=null;
      targets.forEach(function(t,i){if(t&&t.offsetTop<=y)cur=links[i].getAttribute('href');});
      links.forEach(function(a){a.classList.toggle('active',a.getAttribute('href')===cur);});
    };
    window.addEventListener('scroll',spy,{passive:true});spy();
  }
})();
</script>
</body>
</html>
